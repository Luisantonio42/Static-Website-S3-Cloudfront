<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>

    <meta name="robots" content="noindex" />

    <style>
      :root {
        --bg: #0a0e17;
        --card: #151d2e;
        --text: #f0f4fc;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.08);
        --accent: #6ea8fe;
        --accent-secondary: #a78bfa;
        --gradient-1: linear-gradient(135deg, #6ea8fe 0%, #a78bfa 100%);
        --gradient-2: linear-gradient(135deg, rgba(110, 168, 254, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.25);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        line-height: 1.6;
        overflow: hidden;
        position: relative;
      }

      /* Background decoration */
      body::before {
        content: '';
        position: fixed;
        top: -200px;
        left: 50%;
        transform: translateX(-50%);
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, rgba(110, 168, 254, 0.15), transparent 70%);
        pointer-events: none;
        animation: pulse 8s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
        50% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      .card {
        max-width: 560px;
        padding: 48px 40px;
        border-radius: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        text-align: center;
        position: relative;
        z-index: 1;
        box-shadow: var(--shadow-lg);
        animation: fadeInUp 0.6s ease;
      }

      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--gradient-2);
        border-radius: 24px;
        opacity: 0.5;
        z-index: -1;
      }

      h1 {
        font-size: 120px;
        margin: 0 0 16px;
        letter-spacing: -3px;
        font-weight: 800;
        background: var(--gradient-1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: float 3s ease-in-out infinite;
      }

      p {
        color: var(--muted);
        margin: 0 0 32px;
        font-size: 18px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 14px 32px;
        border-radius: 12px;
        background: var(--gradient-1);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 16px rgba(110, 168, 254, 0.3);
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(110, 168, 254, 0.4);
      }

      a:active {
        transform: translateY(0);
      }

      /* Decorative elements */
      .card::after {
        content: '';
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        bottom: -1px;
        background: var(--gradient-1);
        border-radius: 24px;
        opacity: 0;
        z-index: -2;
        transition: opacity 0.3s ease;
      }

      .card:hover::after {
        opacity: 0.1;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>404</h1>
      <p>The page you’re looking for doesn’t exist or was moved.</p>
      <a href="./index.html">Back to home</a>
    </main>
  </body>
</html>
